{% with current=request.resolver_match.url_name %}
<a href="{% url 'dashboard' %}" class="flex h-11 items-center gap-3 rounded-md border-l-4 px-3 text-sm font-semibold transition-colors {% if current == 'dashboard' %}border-brand-orange bg-white/10 text-white{% else %}border-transparent text-slate-300 hover:bg-white/5 hover:text-white{% endif %}">
  <i data-lucide="layout-dashboard" class="h-5 w-5"></i><span>Dashboard</span>
</a>
