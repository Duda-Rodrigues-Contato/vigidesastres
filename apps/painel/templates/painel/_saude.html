{% if saude %}
<p class="-mt-3 mb-5 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-slate-500">
  <span class="font-semibold text-slate-600">Última coleta:</span>
  {% for s in saude %}
  <span title="{{ s.detalhe }}" class="{% if s.estado == 'erro' %}font-semibold text-red-700{% elif s.estado == 'atrasada' %}font-semibold text-amber-700{% endif %}">
    {{ s.rotulo }} {{ s.texto }}{% if s.estado == 'atrasada' %} ⚠{% endif %}</span>
  {% endfor %}
</p>
{% endif %}
